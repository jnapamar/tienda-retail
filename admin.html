<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Ripley</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        header { background: #222; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .badge-rol { background: #007bff; color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: auto; font-size: 12px; }
        .btn-logout:hover { background: #c82333; }

        .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto 30px auto; }
        h3 { margin-bottom: 20px; border-bottom: 2px solid #222; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        
        /* Botones de formulario */
        .acciones-form { display: flex; gap: 10px; }
        button { background: #222; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; }
        button:hover { background: #444; }
        .btn-cancelar { background: #6c757d; display: none; }
        .btn-cancelar:hover { background: #5a6268; }

        /* Estilos para la lista de productos */
        .lista-productos { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .producto-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; gap: 10px; }
        .producto-info { display: flex; align-items: center; gap: 15px; }
        .producto-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; background: #eee; }
        .producto-detalles h4 { font-size: 15px; margin-bottom: 3px; }
        .producto-detalles p { font-size: 12px; color: #666; }
        
        .acciones-item { display: flex; gap: 5px; }
        .btn-editar { background: #ffc107; color: #212529; padding: 8px 12px; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; width: auto; }
        .btn-editar:hover { background: #e0a800; }
        .btn-eliminar { background: #dc3545; color: white; padding: 8px 12px; border: none; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; width: auto; }
        .btn-eliminar:hover { background: #c82333; }
        
        /* Modal de Login */
        #seccionLogin { max-width: 400px; margin: 80px auto; }
    </style>
</head>
<body>

    <!-- VISTA 1: FORMULARIO DE LOGIN (Visible cuando NO hay token) -->
    <div id="seccionLogin" class="box" style="display: none;">
        <h3>🔑 Iniciar Sesión Administrador</h3>
        <form onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="loginEmail" required placeholder="admin@tienda.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" required placeholder="**********">
            </div>
            <button type="submit" id="btnLogin">Ingresar al Panel</button>
        </form>
    </div>

    <!-- VISTA 2: PANEL ADMINISTRADOR (Visible cuando SÍ hay token) -->
    <div id="seccionPanel" style="display: none;">
        <header>
            <h1>🛠️ PANEL DE CONTROL</h1>
            <div class="user-info">
                <span id="lblUsuario">Cargando...</span>
                <span id="lblRol" class="badge-rol"></span>
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </header>

        <!-- FORMULARIO PARA REGISTRAR NUEVO USUARIO (Solo Admin) -->
        <div class="box solo-admin">
            <h3>👤 Registrar Nuevo Usuario</h3>
            <form id="formUsuario" onsubmit="crearUsuario(event)">
                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Nombre del Usuario</label>
                        <input type="text" id="usuarioNombre" required placeholder="Ej. Juan Pérez">
                    </div>
                    <div style="flex: 1;">
                        <label>Rol de Usuario</label>
                        <select id="usuarioRol">
                            <option value="vendedor">Vendedor</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Correo Electrónico</label>
                        <input type="email" id="usuarioEmail" required placeholder="correo@tienda.com">
                    </div>
                    <div style="flex: 1;">
                        <label>Contraseña</label>
                        <input type="password" id="usuarioPassword" required placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="btnCrearUsuario" style="background: #28a745;">Crear Usuario</button>
            </form>
        </div>

        <!-- FORMULARIO PARA AGREGAR / EDITAR PRODUCTO (Solo Admin) -->
        <div class="box solo-admin">
            <h3 id="tituloFormulario">Subir Nuevo Producto al Catálogo</h3>
            <form id="formProducto" onsubmit="enviarAlBackend(event)">
                <input type="hidden" id="productoId">
                <input type="hidden" id="imagenActual">

                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Código del Producto</label>
                        <input type="text" id="codigo" required placeholder="Ej. PROD-101">
                    </div>
                    <div style="flex: 1;">
                        <label>Vendedor Asignado</label>
                        <input type="text" id="vendedor" required placeholder="Nombre del vendedor">
                    </div>
                </div>

                <div class="form-group"><label>Nombre del Ítem</label><input type="text" id="nombre" required></div>
                
                <div class="form-group" style="display: flex; gap: 15px;">
                    <div style="flex: 1;"><label>Precio (S/.)</label><input type="number" step="0.01" id="precio" required></div>
                    <div style="flex: 1;"><label>Stock Inicial (Unidades)</label><input type="number" id="stock" min="1" required placeholder="Ej. 10"></div>
                </div>
                
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="categoria">
                        <option value="Tecnología">Tecnología</option>
                        <option value="Moda">Moda</option>
                        <option value="Servicios">Servicios</option>
                        <option value="Dulces">Dulces</option>
                        <option value="Bisuteria">Bisuteria</option>
                        <option value="Belleza">Belleza</option>
                        <option value="Regalos">Regalos</option>
                        <option value="Educacion">Educacion</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label id="lblImagen">Imagen del Producto (Subir archivo de la PC)</label>
                    <input type="file" id="imagenFile" accept="image/*" required>
                    <small id="txtHelperImagen" style="color: #666; font-size: 11px; display: none;">Deja este campo vacío si deseas mantener la imagen actual.</small>
                </div>

                <div class="form-group"><label>Descripción / Detalles</label><textarea id="descripcion" rows="3" required></textarea></div>
                
                <div class="acciones-form">
                    <button type="submit" id="btnGuardar">Publicar en la Tienda</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar" onclick="limpiarFormulario()">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- LISTA DE PRODUCTOS PUBLICADOS -->
        <div class="lista-productos">
            <h3>Gestionar Catálogo Actual</h3>
            <div id="contenedorProductos">Cargando productos del servidor...</div>
        </div>
    </div>

    <script>
        let productosCache = [];

        document.addEventListener("DOMContentLoaded", verificarSesion);

        // 0. CONTROL DE SESIÓN, ROLES Y VISTAS
        function verificarSesion() {
            const token = localStorage.getItem('token');
            const usuarioStr = localStorage.getItem('usuario');

            if (token) {
                document.getElementById('seccionLogin').style.display = 'none';
                document.getElementById('seccionPanel').style.display = 'block';

                let usuario = {};
                if (usuarioStr) {
                    usuario = JSON.parse(usuarioStr);
                    document.getElementById('lblUsuario').innerText = `👤 ${usuario.nombre || usuario.email}`;
                    document.getElementById('lblRol').innerText = usuario.rol || 'vendedor';
                }

                // Control visual según el rol
                const esAdmin = usuario.rol === 'admin';
                document.querySelectorAll('.solo-admin').forEach(el => {
                    el.style.display = esAdmin ? 'block' : 'none';
                });

                cargarProductos();
            } else {
                document.getElementById('seccionLogin').style.display = 'block';
                document.getElementById('seccionPanel').style.display = 'none';
            }
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');

            btn.innerText = "Ingresando...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario || { email }));
                    verificarSesion();
                } else {
                    alert("❌ Error: " + (data.error || "Credenciales incorrectas"));
                }
            } catch (error) {
                alert("❌ Error de conexión con el servidor.");
            } finally {
                btn.innerText = "Ingresar al Panel";
                btn.disabled = false;
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('token');
            localStorage.removeItem('usuario');
            verificarSesion();
        }

        // 1. CARGAR Y MOSTRAR PRODUCTOS
        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                productosCache = await res.json();
                const contenedor = document.getElementById('contenedorProductos');

                const usuarioStr = localStorage.getItem('usuario');
                const usuario = usuarioStr ? JSON.parse(usuarioStr) : {};
                const esAdmin = usuario.rol === 'admin';

                if (!productosCache || productosCache.length === 0) {
                    contenedor.innerHTML = "<p style='color: #888; font-size: 14px;'>No hay productos en el catálogo.</p>";
                    return;
                }

                contenedor.innerHTML = "";
                
                productosCache.forEach(prod => {
                    const idUnico = prod._id || prod.id;

                    const accionesHTML = esAdmin ? `
                        <div class="acciones-item">
                            <button class="btn-editar" onclick="prepararEdicion('${idUnico}')">Editar</button>
                            <button class="btn-eliminar" onclick="eliminarProducto('${idUnico}')">Eliminar</button>
                        </div>
                    ` : '';

                    contenedor.innerHTML += `
                        <div class="producto-item">
                            <div class="producto-info">
                                <img src="${prod.imagen || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50?text=Sin+Img'" alt="${prod.nombre}">
                                <div class="producto-detalles">
                                    <h4>${prod.nombre} <span style="color: #666; font-size: 11px;">(${prod.codigo || 'S/C'})</span></h4>
                                    <p>Vendedor: ${prod.vendedor || 'No asignado'}</p>
                                    <p>Precio: S/. ${prod.precio} | Stock: ${prod.stock || 0} u.</p>
                                </div>
                            </div>
                            ${accionesHTML}
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('contenedorProductos').innerHTML = "Error al conectar con el servidor.";
            }
        }

        // 2. CREAR NUEVO USUARIO (ADMIN)
        async function crearUsuario(e) {
            e.preventDefault();

            const token = localStorage.getItem('token');
            if (!token) return cerrarSesion();

            const btn = document.getElementById('btnCrearUsuario');
            btn.innerText = "Creando usuario...";
            btn.disabled = true;

            const nuevoUsuario = {
                nombre: document.getElementById('usuarioNombre').value,
                email: document.getElementById('usuarioEmail').value,
                password: document.getElementById('usuarioPassword').value,
                rol: document.getElementById('usuarioRol').value
            };

            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(nuevoUsuario)
                });

                const data = await res.json();

                if (res.ok) {
                    alert("✅ Usuario creado exitosamente.");
                    document.getElementById('formUsuario').reset();
                } else {
                    alert("❌ Error: " + (data.error || "No se pudo crear el usuario."));
                }
            } catch (error) {
                alert("❌ Error de conexión al crear usuario.");
            } finally {
                btn.innerText = "Crear Usuario";
                btn.disabled = false;
            }
        }

        // 3. PREPARAR FORMULARIO PARA EDITAR
        function prepararEdicion(id) {
            const prod = productosCache.find(p => (p._id || p.id) === id);
            if (!prod) return;

            document.getElementById('productoId').value = id;
            document.getElementById('codigo').value = prod.codigo || '';
            document.getElementById('vendedor').value = prod.vendedor || '';
            document.getElementById('nombre').value = prod.nombre || '';
            document.getElementById('precio').value = prod.precio || '';
            document.getElementById('stock').value = prod.stock || '';
            document.getElementById('categoria').value = prod.categoria || 'Tecnología';
            document.getElementById('descripcion').value = prod.descripcion || '';
            document.getElementById('imagenActual').value = prod.imagen || '';

            document.getElementById('imagenFile').required = false;
            document.getElementById('txtHelperImagen').style.display = 'block';

            document.getElementById('tituloFormulario').innerText = "✏️ Modificar Producto";
            document.getElementById('btnGuardar').innerText = "Guardar Cambios";
            document.getElementById('btnCancelar').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. ENVIAR NUEVO PRODUCTO O GUARDAR EDICIÓN
        async function enviarAlBackend(e) {
            e.preventDefault();

            const token = localStorage.getItem('token');
            if (!token) return cerrarSesion();

            const btn = document.getElementById('btnGuardar');
            const id = document.getElementById('productoId').value;
            const esEdicion = Boolean(id);

            btn.innerText = esEdicion ? "Guardando cambios..." : "Optimizando imagen y publicando...";
            btn.disabled = true;

            const inputImagen = document.getElementById('imagenFile');
            const archivoImagen = inputImagen.files[0];
            let imagenFinal = document.getElementById('imagenActual').value;

            if (archivoImagen) {
                try {
                    imagenFinal = await optimizarYConvertirImagen(archivoImagen);
                } catch (err) {
                    alert("❌ Error al procesar la imagen seleccionada.");
                    btn.innerText = esEdicion ? "Guardar Cambios" : "Publicar en la Tienda";
                    btn.disabled = false;
                    return;
                }
            }

            const productoData = {
                codigo: document.getElementById('codigo').value,
                vendedor: document.getElementById('vendedor').value,
                nombre: document.getElementById('nombre').value,
                precio: parseFloat(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value),
                categoria: document.getElementById('categoria').value,
                descripcion: document.getElementById('descripcion').value,
                imagen: imagenFinal
            };

            const url = esEdicion ? `/api/productos/${id}` : '/api/productos';
            const metodo = esEdicion ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, { 
                    method: metodo, 
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productoData)
                });
                
                const resultado = await res.json();

                if (res.ok) {
                    alert(esEdicion ? "✅ Producto actualizado con éxito." : "✅ Producto publicado con éxito.");
                    limpiarFormulario();
                    cargarProductos();
                } else {
                    alert("❌ Error: " + (resultado.error || "No tienes permisos o el Token ha expirado."));
                    if (res.status === 401 || res.status === 403) cerrarSesion();
                }
            } catch (error) { 
                alert("Error de conexión al procesar la solicitud."); 
            } finally {
                btn.innerText = esEdicion ? "Guardar Cambios" : "Publicar en la Tienda";
                btn.disabled = false;
            }
        }

        // 5. RESTABLECER FORMULARIO
        function limpiarFormulario() {
            document.getElementById('formProducto').reset();
            document.getElementById('productoId').value = '';
            document.getElementById('imagenActual').value = '';
            document.getElementById('imagenFile').required = true;
            document.getElementById('txtHelperImagen').style.display = 'none';

            document.getElementById('tituloFormulario').innerText = "Subir Nuevo Producto al Catálogo";
            document.getElementById('btnGuardar').innerText = "Publicar en la Tienda";
            document.getElementById('btnCancelar').style.display = 'none';
        }

        // OPTIMIZACIÓN DE IMÁGENES DE PC
        function optimizarYConvertirImagen(archivo) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(archivo);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // 6. ELIMINAR PRODUCTO (CON TOKEN)
        async function eliminarProducto(id) {
            const token = localStorage.getItem('token');
            if (!token) return cerrarSesion();

            if (!confirm("⚠️ ¿Estás seguro de eliminar este producto?")) return;

            try {
                const res = await fetch(`/api/productos/${id}`, { 
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const resultado = await res.json();
                
                if (res.ok) {
                    alert("🗑️ " + resultado.mensaje);
                    cargarProductos();
                } else {
                    alert("No se pudo eliminar: " + (resultado.error || "Acceso denegado"));
                    if (res.status === 401 || res.status === 403) cerrarSesion();
                }
            } catch (error) {
                alert("Error de conexión al intentar eliminar.");
            }
        }
    </script>
</body>
</html>
